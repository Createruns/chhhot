# Install XFCE4 Desktop and RDP Server

apt_update_with_retry() {
    local attempt=0
    local max_attempts=5
    local backoff=30
    while (( attempt < max_attempts )); do
        if apt update; then
            return 0
        fi
        attempt=$((attempt + 1))
        echo "Failed to update packages. Retrying in ${backoff}s..."
        sleep ${backoff}
        backoff=$((backoff * 2))
        echo "Retrying..."
    done
    echo "Failed to update packages after ${max_attempts} attempts." >&2
    return 1
}

fix_package_state() {
    apt --fix-broken install -y || true
    apt clean || true
    apt autoclean || true
    dpkg --configure -a || true
}

# Call fix_package_state before upgrading packages
fix_package_state

# Upgrade packages
apt_update_with_retry && apt upgrade -y || true

# Install core packages with error recovery
if ! apt install -y xfce4 xfce4-goodies; then
    echo "❌ Failed to install XFCE4. Attempting recovery..."
    fix_package_state
    apt install -y xfce4 xfce4-goodies || echo "⚠️ XFCE4 installation failed again. Continuing..."
fi

# Install Firefox with apt fallback to snap
if ! apt install -y firefox; then
    echo "⚠️ Firefox installation via apt failed. Attempting snap installation..."
    if ! snap install firefox; then
        echo "❌ Firefox installation failed via both apt and snap."
    else
        echo "✅ Firefox installed via snap."
    fi
else
    echo "✅ Firefox installed via apt."
fi

# Start services with error logging but continue on failure
if ! systemctl start xrdp; then
    echo "⚠️ Failed to start XRDP service."
fi
if ! systemctl start xfce4-session; then
    echo "⚠️ Failed to start XFCE session service."
fi

# End of XFCE4 Desktop and RDP Server installation
