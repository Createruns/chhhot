name: Ubuntu RDP Remote Access

on:
  # Manual trigger - click "Run workflow" button
  workflow_dispatch:
    inputs:
      session_duration:
        description: "Session duration in minutes (min: 20, max: 360)"
        required: true
        default: "345"
        type: choice
        options:
          - "20"
          - "30"
          - "60"
          - "90"
          - "120"
          - "180"
          - "240"
          - "345"
          - "360"

jobs:
  ubuntu-rdp:
    # Pin a concrete image — ubuntu-latest currently rolls an Ubuntu 26.04
    # pre-release and its runner pool can stall in "queued" for long periods.
    runs-on: ubuntu-latest
    # Customizable timeout: manual trigger uses chosen duration, schedule defaults to 60 min (max: 360 = 6 hours)
    timeout-minutes: ${{ fromJSON(github.event.inputs.session_duration || '60') }}

    # Write access is needed only to publish the recording-proof branch
    permissions:
      contents: write

    steps:
      - name: "Install XFCE4 Desktop and RDP Server"
        run: |
          echo "Installing XFCE4 desktop environment and xRDP..."

          # Retry function with exponential backoff
          apt_retry() {
            local n=0
            local max_retry=5
            local delay=30
            while true; do
              if sudo apt "$@"; then
                return 0
              fi
              n=$((n+1))
              if [ $n -ge $max_retry ]; then
                echo "Max retries reached"
                return 1
              fi
              echo "Retrying in $((delay * 2 ** (n-1)))s..."
              sleep $((delay * 2 ** (n-1)))
            done
          }

          # Fix broken packages
          sudo apt --fix-broken install -y || true
          sudo apt clean || true

          # Update and install
          apt_retry update || exit 1
          apt_retry install -y xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils ffmpeg || exit 1

          # Firefox with fallback
          sudo apt install -y firefox || sudo snap install firefox || echo "Firefox skipped"

          # Start services
          sudo service dbus start
          sudo service xrdp start

          echo "✅ Installation completed!"

      - name: "Create User and Configure Access"
        run: |
          echo "Creating user 'gg' with sudo privileges..."

          # Create user 'gg' with password 'root' (non-interactive)
          echo "gg:root" | sudo chpasswd 2>/dev/null || {
            sudo useradd -m -s /bin/bash gg
            echo "gg:root" | sudo chpasswd
          }

          # Add user to sudo group
          sudo usermod -aG sudo gg

          # xrdp executes the .xsession of the LOGGED-IN user (gg). A file written
          # to the workflow user's home (~ = /home/runner) is ignored for RDP logins.
          sudo mkdir -p /home/gg
          echo "startxfce4" | sudo tee /home/gg/.xsession >/dev/null
          sudo chown -R gg:gg /home/gg
          sudo chmod +x /home/gg/.xsession

          # Suppress the polkit popup ("Authentication is required to create a color
          # managed device") that would otherwise interrupt the RDP desktop session.
          sudo tee /etc/polkit-1/rules.d/50-xrdp-colord.rules >/dev/null <<'POLKIT'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") === 0 ||
                action.id.indexOf("org.freedesktop.timedatectl.") === 0 ||
                action.id.indexOf("org.freedesktop.hostname1.") === 0) {
              return polkit.Result.YES;
            }
          });
          POLKIT

          # Set root password to 'root'
          echo "root:root" | sudo chpasswd

          echo "✅ User 'gg' created with sudo privileges"
          echo "✅ Username: gg"
          echo "✅ Password: root"
          echo "✅ Root password set to: root"

      - name: "Configure SSH for Password Authentication"
        run: |
          echo "Configuring SSH for password authentication..."

          # Backup existing SSH config
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.backup

          # Create new SSH config
          sudo bash -c 'cat > /etc/ssh/sshd_config << "SSHEOF"
          # SSH LOGIN SETTINGS
          PasswordAuthentication yes
          PermitRootLogin yes
          PubkeyAuthentication no
          ChallengeResponseAuthentication no
          UsePAM yes

          # SFTP SETTINGS
          Subsystem sftp /usr/lib/openssh/sftp-server
          SSHEOF'

          # Restart SSH service
          sudo service ssh restart

          echo "✅ SSH configured for password authentication"

      - name: "Display Connection Information"
        run: |
          echo ""
          echo "UBUNTU RDP ACCESS READY"
          echo "=================================================="
          echo "Runner: ubuntu-latest-l"
          echo "OS: Ubuntu Latest"
          echo ""
          echo "🔗 Connection Details:"
          echo "   RDP/SSH Access is now configured"
          echo "   Username: gg"
          echo "   Password: root"
          echo "   Root Password: root"
          echo ""
          echo "📋 Connection Instructions:"
          echo "1. RDP Connection:"
          echo "   - Use any RDP client (Remote Desktop Connection)"
          echo "   - Connect to the runner's IP address"
          echo "   - Login with username: gg, password: root"
          echo ""
          echo "2. SSH Connection:"
          echo "   - Use: ssh gg@<runner-ip>"
          echo "   - Password: root"
          echo ""
          echo "🎥 FULL SESSION RECORDING is enabled — live proof (refreshed every 5 min):"
          echo "   https://github.com/${GITHUB_REPOSITORY}/tree/rdp-session-info  (info.md + proof.png)"
          echo "   Recording clips are included in the downloads-backup artifact at session end."
          echo ""
          echo "⏳ Session will run until manually stopped"
          echo "=================================================="
          echo ""

          # Display network information
          echo "Network Information:"
          ip addr show | grep -E 'inet ' | grep -v '127.0.0.1' || echo "Network info not available"
          echo ""

      - name: "Maintain Connection and Setup Pinggy Tunnel"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Maintaining connection and setting up remote access..."
          echo "Session started at: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""

          # Install openssh-client if not present
          sudo apt-get update
          sudo apt-get install -y openssh-client

          # ────────────────────────────────────────────────────────────
          # 🎥 FULL SESSION RECORDING — live proof on branch rdp-session-info
          # Recording starts automatically as soon as an RDP session appears
          # (an Xorg display owned by gg), and the proof file + a fresh
          # screenshot are pushed to rdp-session-info every 5 minutes.
          # ────────────────────────────────────────────────────────────
          RECDIR=/home/gg/.session-recording
          sudo mkdir -p "$RECDIR"
          sudo chown gg:gg "$RECDIR"
          GG_UID="$(id -u gg)"

          find_active_display() {
            local line tok d auth u disp
            pgrep -a Xorg 2>/dev/null || true | while read -r line; do
              d=""
              auth=""
              for tok in $line; do
                if [ "$tok" = "-auth" ]; then auth=next; continue; fi
                if [ "$auth" = "next" ]; then auth="$tok"; continue; fi
                case "$tok" in
                  :[0-9]*) d="$tok";;
                esac
              done
              [ -n "$d" ] || continue
              disp="${d#*:}"; disp="${disp%%.*}"
              [ -S "/tmp/.X11-unix/X$disp" ] || continue
              u="$(stat -c %u "/tmp/.X11-unix/X$disp" 2>/dev/null || true)"
              # Trust either the socket owner (gg) or an Xauthority under gg's home
              if [ "$u" = "$GG_UID" ] || [ "${auth#*gg}" != "$auth" ] || [ "${auth#*/home/gg}" != "$auth" ]; then
                echo "$disp"
                break
              fi
            done | head -n 1
          }

          publish_proof() {
            local tag="$1"
            local pub=/tmp/rdp-proof
            rm -rf "$pub"; mkdir -p "$pub"
            local disp
            disp="$(find_active_display)"
            {
              echo "# Ubuntu RDP session — recording proof"
              echo ""
              echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Proof refreshed (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
              if [ -n "$disp" ]; then
                echo "- Recording: ON (display :$disp)"
              else
                echo "- Recording: waiting for your first RDP login (starts automatically)"
              fi
              echo "- Recorder processes: $(pgrep -x ffmpeg | wc -l)"
              echo ""
              echo "## Clips (a new one every 5 minutes)"
              echo ""
              echo '```'
              sudo ls -lh "$RECDIR" 2>/dev/null | awk '/sess_.*\.mp4/ {print $5, $9}'
              echo '```'
              echo ""
              echo "All clips are attached to the run's downloads-backup artifact when the session ends."
            } > "$pub/info.md"
            if [ -n "$disp" ]; then
              sudo -u gg HOME=/home/gg DISPLAY=":$disp" XAUTHORITY=/home/gg/.Xauthority \
                ffmpeg -nostdin -y -hide_banner -loglevel error \
                -f x11grab -framerate 2 -i ":$disp" -frames:v 1 /tmp/rdp-proof-shot.png 2>/dev/null || true
              if [ -s /tmp/rdp-proof-shot.png ]; then
                sudo chown "$(id -u):$(id -g)" /tmp/rdp-proof-shot.png 2>/dev/null || true
                if [ "$(stat -c %s /tmp/rdp-proof-shot.png)" -gt 1024 ]; then
                  cp /tmp/rdp-proof-shot.png "$pub/proof.png"
                fi
                sudo rm -f /tmp/rdp-proof-shot.png
              fi
            fi
            (
              cd "$pub"
              git init -q .
              git add -A
              git -c user.name=rdp-bot -c user.email=rdp-bot@users.noreply.github.com commit -qm "recording proof ($tag)"
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/rdp-session-info \
                || echo "::warning::could not publish recording proof to rdp-session-info"
            )
          }

          # Recorder: grabs the gg RDP display; restarts on reconnects (new display)
          (
            while true; do
              if ! pgrep -x ffmpeg >/dev/null 2>&1; then
                disp="$(find_active_display)"
                if [ -n "$disp" ]; then
                  echo "[$(date '+%Y-%m-%d %H:%M:%S')] 🎥 Recording started on display :$disp"
                  sudo -u gg HOME=/home/gg DISPLAY=":$disp" XAUTHORITY=/home/gg/.Xauthority \
                    ffmpeg -nostdin -hide_banner -loglevel error \
                    -f x11grab -framerate 10 -i ":$disp" \
                    -c:v libx264 -preset ultrafast -crf 25 -pix_fmt yuv420p \
                    -f segment -segment_time 300 -reset_timestamps 1 -strftime 1 \
                    "$RECDIR/sess_%Y%m%dT%H%M%SZ.mp4" \
                    >"$RECDIR/ffmpeg.log" 2>&1 &
                else
                  echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏳ Waiting for an RDP session to record..."
                fi
              fi
              sleep 20
            done
          ) &
          publish_proof "initial"

          echo ""
          echo "SETTING UP PINGGY SSH TUNNEL FOR REMOTE ACCESS"
          echo "=================================================="
          echo "Establishing secure tunnel for RDP access (port 3389)"
          echo "This will provide a public URL to access your RDP session"
          echo ""

          # Start health check in background
          (
            while true; do
              # Health check - verify xrdp is running
              if ! sudo service xrdp status > /dev/null 2>&1; then
                  echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⚠️ xRDP service not running, attempting restart..."
                  sudo service xrdp restart
                  sleep 5
              fi

              # Health check - verify SSH is running
              if ! sudo service ssh status > /dev/null 2>&1; then
                  echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⚠️ SSH service not running, attempting restart..."
                  sudo service ssh restart
                  sleep 5
              fi

              publish_proof "periodic"

              sudo ls -lh "$RECDIR"/sess_*.mp4 2>/dev/null | awk '{print "  clip:", $5, $9}' || true
              sleep 300  # 5 minutes between health checks
            done
          ) &

          # Start SSH tunnel via Pinggy for RDP access (this will keep the connection alive)
          # This creates a public URL for accessing the RDP service on port 3389
          echo "Starting Pinggy tunnel - this will keep the session alive..."
          echo "The tunnel URL will be displayed below:"
          echo ""
          while true; do
            ssh -p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 crfjhd5ooCq+tcp@pro.pinggy.io
            sleep 10
          done

          echo ""
          echo "✅ Session ended"
          echo "=================================================="

      # ──────────────────────────────────────────────────────────────
      # ARTIFACT UPLOAD — saves everything in /root/Downloads/
      # Runs even if the session is cancelled or fails (always: true)
      # ──────────────────────────────────────────────────────────────
      - name: "Prepare Downloads Folder for Upload"
        if: always()
        run: |
          echo "=================================================="
          echo "📦 PREPARING ARTIFACT UPLOAD FROM /root/Downloads/"
          echo "=================================================="

          # Ensure /root/Downloads exists and is accessible
          sudo mkdir -p /root/Downloads
          sudo chmod -R 755 /root/Downloads
          sudo chown -R $(whoami):$(whoami) /root/Downloads

          # Create clean staging directory in workspace
          rm -rf "$GITHUB_WORKSPACE/artifact-downloads"
          mkdir -p "$GITHUB_WORKSPACE/artifact-downloads"

          # ── Primary: /root/Downloads/ ──────────────────────────
          echo "📂 Copying from /root/Downloads/ ..."
          sudo cp -r /root/Downloads/. "$GITHUB_WORKSPACE/artifact-downloads/" 2>/dev/null && \
            echo "✅ /root/Downloads/ copied successfully" || \
            echo "⚠️  /root/Downloads/ is empty or not accessible"

          # ── Secondary: ~/Downloads/ (runner home) ──────────────
          if [ -d "$HOME/Downloads" ] && [ "$HOME" != "/root" ]; then
            echo "📂 Copying from $HOME/Downloads/ ..."
            cp -r "$HOME/Downloads/." "$GITHUB_WORKSPACE/artifact-downloads/" 2>/dev/null && \
              echo "✅ $HOME/Downloads/ copied successfully" || \
              echo "⚠️  $HOME/Downloads/ is empty"
          fi

          # ── Third: RDP user gg's downloads ─────────────────────
          sudo mkdir -p /home/gg/Downloads
          sudo cp -r /home/gg/Downloads/. "$GITHUB_WORKSPACE/artifact-downloads/gg-Downloads/" 2>/dev/null && \
            echo "✅ gg's Downloads copied" || echo "⚠️  gg's Downloads is empty"

          # ── Fourth: full session recording clips ───────────────
          sudo mkdir -p "$GITHUB_WORKSPACE/artifact-downloads/session-recording"
          sudo cp -r /home/gg/.session-recording/. "$GITHUB_WORKSPACE/artifact-downloads/session-recording/" 2>/dev/null && \
            echo "✅ Session recording copied" || echo "⚠️  No recording files yet"

          # ── Fix permissions on staged files ────────────────────
          sudo chown -R $(whoami):$(whoami) "$GITHUB_WORKSPACE/artifact-downloads/"
          sudo chmod -R 755 "$GITHUB_WORKSPACE/artifact-downloads/"

          # ── Summary ────────────────────────────────────────────
          echo ""
          echo "📋 Files ready for upload:"
          echo "=================================================="
          find "$GITHUB_WORKSPACE/artifact-downloads/" -type f | while read f; do
            echo "  📄 $f ($(du -sh "$f" | cut -f1))"
          done
          TOTAL=$(du -sh "$GITHUB_WORKSPACE/artifact-downloads/" 2>/dev/null | cut -f1)
          echo "--------------------------------------------------"
          echo "  📦 Total size: ${TOTAL:-0}"
          echo "=================================================="

      - name: "Upload Downloads as Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads-backup-${{ github.run_id }}
          path: artifact-downloads/
          # Keep artifacts for 90 days (max for public repos: 90, private: 400)
          retention-days: 90
          # Don't fail the workflow if there's nothing to upload
          if-no-files-found: warn
