name: AnyDesk Remote Access

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: "Session duration in minutes (max: 360)"
        required: true
        default: "345"
        type: choice
        options:
          - "20"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"
          - "345"
          - "360"

jobs:
  anydesk-session:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.session_duration || '345') }}
    permissions:
      contents: read

    steps:
      - name: "Install AnyDesk"
        run: |
          set -e
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo tee /etc/apt/trusted.gpg.d/anydesk.asc >/dev/null
          echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk.list
          sudo apt-get update -qq
          sudo apt-get install -y anydesk

      - name: "Install XFCE + LightDM + virtual display driver"
        run: |
          set -e
          echo "shared/default-x-display-manager select lightdm" | sudo debconf-set-selections
          sudo apt-get install -y xfce4 xfce4-terminal lightdm lightdm-gtk-greeter xserver-xorg-video-dummy >/dev/null
          RUNNER_USER=$(id -nu 1000)
          echo "Runner desktop user: $RUNNER_USER"

          RUNNER_USER="$RUNNER_USER" bash -c 'printf "%s\n" \
            "[Seat:*]" \
            "autologin-user=${RUNNER_USER}" \
            "autologin-user-timeout=0" \
            "autologin-session=xfce" \
            "user-session=xfce" \
            | sudo tee /etc/lightdm/lightdm.conf >/dev/null'

          printf '%s\n' \
            'Section "Device"' \
            '    Identifier  "DummyDevice"' \
            '    Driver      "dummy"' \
            '    VideoRam    256000' \
            'EndSection' \
            '' \
            'Section "Monitor"' \
            '    Identifier  "DummyMonitor"' \
            '    HorizSync   31.5-48.5' \
            '    VertRefresh 50-70' \
            '    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 +hsync +vsync' \
            'EndSection' \
            '' \
            'Section "Screen"' \
            '    Identifier  "DummyScreen"' \
            '    Device      "DummyDevice"' \
            '    Monitor     "DummyMonitor"' \
            '    DefaultDepth 24' \
            '    SubSection "Display"' \
            '        Depth 24' \
            '        Modes "1920x1080_60.00"' \
            '    EndSubSection' \
            'EndSection' | sudo tee /etc/X11/xorg.conf.d/10-dummy.conf >/dev/null

          sudo systemctl disable gdm3 2>/dev/null || true
          sudo systemctl enable lightdm
          cat /etc/lightdm/lightdm.conf
          ls /usr/share/xsessions/

      - name: "Start X11 desktop session (LightDM autologin)"
        run: |
          set -e
          sudo systemctl start lightdm || true
          SESSION_OK=no
          for i in $(seq 1 90); do
            for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}') ; do
              T=$(loginctl show-session "$s" -p Type --value 2>/dev/null || true)
              C=$(loginctl show-session "$s" -p Class --value 2>/dev/null || true)
              ST=$(loginctl show-session "$s" -p State --value 2>/dev/null || true)
              if [ "$T" = "x11" ] && [ "$C" = "user" ] && [ "$ST" = "active" ]; then SESSION_OK=yes; break 2; fi
            done
            sleep 5
          done
          echo "Logged-in X11 user session detected: $SESSION_OK"
          pgrep -a Xorg || true
          pgrep -a lightdm || true
          for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}') ; do
            echo "session $s: Type=$(loginctl show-session "$s" -p Type --value 2>/dev/null) Class=$(loginctl show-session "$s" -p Class --value 2>/dev/null) State=$(loginctl show-session "$s" -p State --value 2>/dev/null)"
          done
          if [ "$SESSION_OK" != "yes" ]; then
            echo "::error::No active XFCE user session on X11 (autologin failed?)"
            sudo journalctl -u lightdm --no-pager | tail -80 || true
            sudo journalctl -b --no-pager | grep -iE "Xorg|lightdm|pam" | tail -40 || true
            exit 1
          fi
          sleep 20

      - name: "Start AnyDesk as root, set password, show ID"
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          set -e
          sudo -iu "$(id -nu 1000)" pulseaudio --start 2>/dev/null || true
          sudo systemctl restart anydesk
          sleep 3
          ANYDESK_ID=""
          for i in $(seq 1 30); do
            ANYDESK_ID=$(sudo anydesk --get-id || true)
            case "$ANYDESK_ID" in ""|"0") sleep 2;; *) break;; esac
          done
          printf '%s\n' "$ANYDESK_PASSWORD" | sudo anydesk --set-password
          sleep 3
          STATUS=$(sudo anydesk --get-status 2>/dev/null || echo unknown)
          echo "AnyDesk network status: $STATUS"
          {
            echo "### AnyDesk ID: $ANYDESK_ID"
            echo ""
            echo "- Network status: $STATUS"
            echo "- Unattended password: from secret \`ANYDESK_PASSWORD\` (set at repository level)"
            echo "- Display: LightDM autologin XFCE session on X11 (required for incoming AnyDesk sessions)"
            echo "- Wait ~30s for the XFCE desktop to finish loading before connecting."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::AnyDesk ID = $ANYDESK_ID (password set from ANYDESK_PASSWORD secret)"

      - name: "Keep session alive"
        run: |
          while true; do
            date +"%Y-%m-%d %H:%M:%S - session active"
            pgrep Xorg >/dev/null || sudo systemctl restart lightdm || true
            pgrep -x anydesk >/dev/null || sudo systemctl restart anydesk || true
            sleep 60
          done
