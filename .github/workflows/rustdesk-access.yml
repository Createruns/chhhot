name: RustDesk Remote Access

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: "Session duration in minutes (max: 360)"
        required: true
        default: "345"
        type: choice
        options:
          - "20"
          - "30"
          - "60"
          - "120"
          - "180"
          - "300"
          - "345"
          - "360"
      custom_password:
        description: "Manual RustDesk password (leave empty to auto-generate a random one)"
        required: false
        default: ""
        type: string

jobs:
  rustdesk-session:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.session_duration || '345') }}
    permissions:
      contents: read

    steps:
      - name: "Install XFCE + LightDM + virtual display driver"
        run: |
          set -e
          echo "shared/default-x-display-manager select lightdm" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y xfce4 xfce4-terminal lightdm lightdm-gtk-greeter xserver-xorg-video-dummy pipewire pipewire-pulse wireplumber pulseaudio-utils jq >/dev/null
          RUNNER_USER=$(id -nu 1000)
          echo "Runner desktop user: $RUNNER_USER"
          sudo loginctl enable-linger "$RUNNER_USER"

          RUNNER_USER="$RUNNER_USER" bash -c 'printf "%s\n" \
            "[Seat:*]" \
            "autologin-user=${RUNNER_USER}" \
            "autologin-user-timeout=0" \
            "autologin-session=xfce" \
            "user-session=xfce" \
            | sudo tee /etc/lightdm/lightdm.conf >/dev/null'

          printf '%s\n' \
            'Section "Device"' \
            '    Identifier  "DummyDevice"' \
            '    Driver      "dummy"' \
            '    VideoRam    256000' \
            'EndSection' \
            '' \
            'Section "Monitor"' \
            '    Identifier  "DummyMonitor"' \
            '    HorizSync   31.5-48.5' \
            '    VertRefresh 50-70' \
            '    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 +hsync +vsync' \
            'EndSection' \
            '' \
            'Section "Screen"' \
            '    Identifier  "DummyScreen"' \
            '    Device      "DummyDevice"' \
            '    Monitor     "DummyMonitor"' \
            '    DefaultDepth 24' \
            '    SubSection "Display"' \
            '        Depth 24' \
            '        Modes "1920x1080_60.00"' \
            '    EndSubSection' \
            'EndSection' | sudo tee /etc/X11/xorg.conf.d/10-dummy.conf >/dev/null

          sudo systemctl disable gdm3 2>/dev/null || true
          sudo systemctl enable lightdm
          cat /etc/lightdm/lightdm.conf
          ls /usr/share/xsessions/

      - name: "Start X11 desktop session (LightDM autologin)"
        run: |
          set -e
          sudo systemctl start lightdm || true
          SESSION_OK=no
          for i in $(seq 1 90); do
            for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}') ; do
              T=$(loginctl show-session "$s" -p Type --value 2>/dev/null || true)
              C=$(loginctl show-session "$s" -p Class --value 2>/dev/null || true)
              ST=$(loginctl show-session "$s" -p State --value 2>/dev/null || true)
              if [ "$T" = "x11" ] && [ "$C" = "user" ] && [ "$ST" = "active" ]; then SESSION_OK=yes; break 2; fi
            done
            sleep 5
          done
          echo "Logged-in X11 user session detected: $SESSION_OK"
          pgrep -a Xorg || true
          pgrep -a lightdm || true
          for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}') ; do
            echo "session $s: Type=$(loginctl show-session "$s" -p Type --value 2>/dev/null) Class=$(loginctl show-session "$s" -p Class --value 2>/dev/null) State=$(loginctl show-session "$s" -p State --value 2>/dev/null)"
          done
          if [ "$SESSION_OK" != "yes" ]; then
            echo "::error::No active XFCE user session on X11 (autologin failed?)"
            sudo journalctl -u lightdm --no-pager | tail -80 || true
            sudo journalctl -b --no-pager | grep -iE "Xorg|lightdm|pam" | tail -40 || true
            exit 1
          fi
          sudo -u "$(id -nu 1000)" env XDG_RUNTIME_DIR=/run/user/$(id -u "$(id -nu 1000)") systemctl --user restart pipewire pipewire-pulse wireplumber 2>/dev/null || true
          sleep 5
          PACTL_OUT=$(sudo -u "$(id -nu 1000)" env XDG_RUNTIME_DIR=/run/user/$(id -u) pactl info 2>&1 | head -4 || true)
          echo "Audio server check (pactl info):"
          echo "$PACTL_OUT"
          case "$PACTL_OUT" in
            *Server\ Name*|*PipeWire*|*PulseAudio*) echo "::notice::Audio server is up";;
            *) echo "::warning::Audio server not reachable";;
          esac
          sleep 20

      - name: "Install RustDesk"
        run: |
          set -e
          DEB_URL=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '[.assets[] | select(.name | test("^rustdesk-[0-9.]+-x86_64\\.deb$")) | .browser_download_url][0]')
          echo "RustDesk deb: $DEB_URL"
          if [ -z "$DEB_URL" ]; then
            echo "::error::Could not find latest RustDesk x86_64 deb asset"
            exit 1
          fi
          wget -q "$DEB_URL" -O /tmp/rustdesk.deb
          ls -la /tmp/rustdesk.deb
          sudo apt-get install -fy /tmp/rustdesk.deb >/dev/null
          if systemctl list-unit-files rustdesk.service --quiet 2>/dev/null; then
            sudo systemctl enable --now rustdesk
          else
            sudo /usr/bin/rustdesk --install || true
            sudo systemctl enable --now rustdesk
          fi
          sleep 3

      - name: "Start desktop RustDesk server and set unattended password"
        env:
          CUSTOM_PASSWORD: ${{ github.event.inputs.custom_password }}
        run: |
          set -euo pipefail

          RUNNER_USER="$(id -nu 1000)"
          RUNNER_UID="$(id -u 1000)"
          echo "Desktop user: $RUNNER_USER ($RUNNER_UID)"

          # The root service spawns `rustdesk --server` as the logged-in desktop user.
          # That child owns the ID and the permanent password, so wait for it before touching the CLI.
          sudo systemctl enable rustdesk >/dev/null 2>&1 || true
          sudo systemctl restart rustdesk || sudo systemctl start rustdesk

          user_server_up() {
            pgrep -u "$RUNNER_UID" -f 'rustdesk --server' >/dev/null 2>&1
          }
          wait_user_server() {
            local i
            for i in $(seq 1 90); do
              if user_server_up; then echo "desktop --server process detected after ${i}s"; return 0; fi
              sleep 1
            done
            return 1
          }

          if ! wait_user_server; then
            echo "::warning::Service did not spawn the desktop server within 90s — launching it manually"
            SES_PID="$(pgrep -u "$RUNNER_UID" -x xfce4-session | head -1 || true)"
            DISPLAY_VAL=":0"
            XAUTH_VAL=""
            if [ -n "${SES_PID:-}" ]; then
              DISPLAY_VAL="$(tr '\0' '\n' < "/proc/$SES_PID/environ" | sed -n 's/^DISPLAY=//p' | head -1 || true)"
              XAUTH_VAL="$(tr '\0' '\n' < "/proc/$SES_PID/environ" | sed -n 's/^XAUTHORITY=//p' | head -1 || true)"
            fi
            DISPLAY_VAL="${DISPLAY_VAL:-:0}"
            nohup sudo -u "$RUNNER_USER" env DISPLAY="$DISPLAY_VAL" \
              XDG_RUNTIME_DIR="/run/user/$RUNNER_UID" ${XAUTH_VAL:+XAUTHORITY=$XAUTH_VAL} \
              /usr/bin/rustdesk --server >/tmp/rustdesk-user-server.log 2>&1 &
            if ! wait_user_server; then
              echo "::error::Desktop RustDesk server never started"
              tail -60 /tmp/rustdesk-user-server.log || true
              exit 1
            fi
          fi
          sleep 3
          pgrep -a -u "$RUNNER_UID" -f rustdesk || true
          ls -la "/tmp/rustdesk-$RUNNER_UID/" 2>/dev/null || true

          # ID now comes from the desktop instance (the one clients actually reach)
          RUSTDESK_ID=""
          for i in $(seq 1 30); do
            RUSTDESK_ID=$(sudo rustdesk --get-id 2>/dev/null || true)
            case "$RUSTDESK_ID" in ""|"0") sleep 2;; *) break;; esac
          done

          # Password: manual input when provided, otherwise random per run
          if [ -n "${CUSTOM_PASSWORD:-}" ]; then
            RUSTDESK_PASSWORD="$CUSTOM_PASSWORD"
            PASS_SOURCE="manual input (custom_password)"
          else
            RUSTDESK_PASSWORD="$(openssl rand -hex 8)"
            PASS_SOURCE="random (auto-generated for this run only)"
          fi
          [ -n "$RUSTDESK_PASSWORD" ] || { echo "::error::Password generation failed"; exit 1; }

          # Apply via the official CLI and REQUIRE its success ACK ("Done!").
          # No ::add-mask:: here: masking also turns the password into *** inside the run summary.
          PASS_OUT=""
          CLI_OK=no
          for attempt in 1 2 3; do
            PASS_OUT=$(sudo rustdesk --password "$RUSTDESK_PASSWORD" 2>&1 || true)
            echo "rustdesk --password attempt $attempt: ${PASS_OUT:-<no output>}"
            case "$PASS_OUT" in *Done!*) CLI_OK=yes; break;; esac
            sleep 5
          done

          RUNNER_HOME="$(getent passwd "$RUNNER_UID" | cut -d: -f6)"
          CONF_DIR="$RUNNER_HOME/.config/rustdesk"
          CONF_FILE="$CONF_DIR/RustDesk.toml"

          if [ "$CLI_OK" != "yes" ]; then
            echo "::warning::CLI could not set the password — dumping daemon log and using the documented on-disk fallback"
            sudo journalctl -u rustdesk --no-pager 2>/dev/null | tail -60 || true
            echo "config dir: $CONF_DIR"; sudo ls -la "$CONF_DIR" 2>/dev/null || true

            # Fallback: permanent password storage = "00" + base64(SHA256(password || salt))
            # (same format RustDesk itself persists and verifies against)
            SALT="$(openssl rand -hex 16)"
            H1_B64="$(printf '%s%s' "$RUSTDESK_PASSWORD" "$SALT" | openssl dgst -sha256 -binary | base64 -w0)"
            STORED="00${H1_B64}"
            sudo mkdir -p "$CONF_DIR"
            if [ -f "$CONF_FILE" ]; then
              sudo sed -i -E '/^[[:space:]]*(password|salt)[[:space:]]*=/d' "$CONF_FILE"
            fi
            { echo "password = '$STORED'"; echo "salt = '$SALT'"; sudo cat "$CONF_FILE" 2>/dev/null || true; } \
              | sudo tee "$CONF_FILE.new" >/dev/null
            sudo mv "$CONF_FILE.new" "$CONF_FILE"
            sudo chown "$RUNNER_UID:$RUNNER_UID" "$CONF_FILE"
            sudo chmod 600 "$CONF_FILE"
            if ! sudo grep -qF "$STORED" "$CONF_FILE"; then
              echo "::error::Fallback password write did not persist"
              exit 1
            fi
            echo "Fallback hash written to $CONF_FILE"
            PASS_METHOD="on-disk hash fallback (verified in $CONF_FILE)"
          else
            PASS_METHOD="rustdesk --password CLI (daemon ACK)"
          fi

          # Restart the service so the desktop server reloads the final config, then re-check
          sudo systemctl restart rustdesk || true
          if ! wait_user_server; then
            echo "::error::Desktop server did not come back after config update"
            exit 1
          fi
          sleep 5
          pgrep -a -u "$RUNNER_UID" -f 'rustdesk --server' || true
          if sudo grep -qiE '^[[:space:]]*password[[:space:]]*=' "$CONF_FILE" 2>/dev/null; then
            echo "Password storage present in $CONF_FILE"
            VERIFIED=yes
          else
            echo "::error::No password storage found in $CONF_FILE"
            VERIFIED=no
          fi

          {
            echo "### RustDesk ID: $RUSTDESK_ID"
            echo ""
            echo "- Unattended password: \`$RUSTDESK_PASSWORD\` ($PASS_SOURCE)"
            echo "- Apply method: $PASS_METHOD"
            echo "- Storage verified: $VERIFIED"
            echo "- Get the free client from https://rustdesk.com/download, enter the ID above and the password."
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotation carries ID+password so it can also be read from the REST API (live).
          echo "::notice title=RustDesk::ID=$RUSTDESK_ID PASSWORD=$RUSTDESK_PASSWORD SOURCE=$PASS_SOURCE VERIFIED=$VERIFIED"

      - name: "Keep session alive"
        run: |
          while true; do
            date +"%Y-%m-%d %H:%M:%S - session active"
            pgrep Xorg >/dev/null || sudo systemctl restart lightdm || true
            pgrep -u 1000 -f 'rustdesk --server' >/dev/null || sudo systemctl restart rustdesk || true
            echo "rustdesk desktop server: $(pgrep -u 1000 -f 'rustdesk --server' >/dev/null && echo up || echo down)"
            sleep 60
          done
